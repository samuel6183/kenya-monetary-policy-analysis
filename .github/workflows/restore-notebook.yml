name: Restore original research data
on:
  workflow_dispatch:
    inputs:
      knbs:
        description: "Also retrieve KNBS report candidates"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src
      - run: python -m src.restore_cbk
      - if: inputs.knbs
        run: python -m src.restore_knbs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-research-data
          path: |
            data/raw/
            data/processed/
